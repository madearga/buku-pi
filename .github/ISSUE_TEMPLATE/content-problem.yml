name: Kesalahan konten atau masalah penyajian
description: Laporkan salah ketik, kesalahan fakta, tautan rusak, atau konten yang sulit dipahami
title: "[Konten] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Halaman atau bab
      description: Isi tautan halaman atau judul bab.
      placeholder: https://pi.argakuka.com/guide/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ditemukan
      description: Jelaskan bagian mana yang tidak akurat, tidak jelas, atau sudah tidak berlaku.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Usulan perbaikan
      description: Opsional; sertakan sumber resmi atau ungkapan yang lebih jelas bila ada.
  - type: checkboxes
    id: privacy
    attributes:
      label: Pemeriksaan sebelum mengirim
      options:
        - label: Saya telah menghapus akun, API Key, path pribadi, dan informasi sensitif lainnya.
          required: true
