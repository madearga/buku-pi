<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prefix-cache-compaction-title prefix-cache-compaction-desc">
    <title id="prefix-cache-compaction-title">Batas prefix cache dan pemadatan</title>
    <desc id="prefix-cache-compaction-desc">Ronde berikutnya menambahkan pesan setelah prefix input yang sama, sehingga berpeluang memakai ulang prompt cache; pemadatan mengganti riwayat lama dengan ringkasan dan mempertahankan pesan terbaru, lalu membangun ulang cache dari titik perubahan.</desc>
