<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-agent-model-title local-agent-model-desc">
    <title id="local-agent-model-title">A local Agent does not mean a local model</title>
    <desc id="local-agent-model-desc">Pi can run locally and connect to a cloud model, or through a local route connect to a model running on your own device; the Agent's location and the inference location must be judged separately.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="local-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker>
      <marker id="local-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker>
      <marker id="local-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker>
    </defs>
    <rect width="960" height="600" fill="#fbfaf6"/>
    <rect x="40" y="104" width="880" height="168" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="56" y="108" width="128" height="16" rx="2" fill="#fbfaf6"/>
    <text x="120" y="120" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">COMMON ROUTE</text>
    <rect x="40" y="316" width="880" height="168" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="56" y="320" width="128" height="16" rx="2" fill="#fbfaf6"/>
    <text x="120" y="332" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">LOCAL MODEL</text>
    <line x1="280" y1="200" x2="380" y2="200" stroke="#276d89" stroke-width="1.2" marker-end="url(#local-arrow-link)"/>
    <line x1="580" y1="200" x2="680" y2="200" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#local-arrow-accent)"/>
    <line x1="280" y1="412" x2="380" y2="412" stroke="#276d89" stroke-width="1.2" marker-end="url(#local-arrow-link)"/>
    <line x1="580" y1="412" x2="680" y2="412" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#local-arrow-accent)"/>
    <rect x="296" y="180" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="330" y="189" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">NETWORK</text>
    <rect x="596" y="180" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="630" y="189" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">INFERENCE</text>
    <rect x="296" y="392" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="330" y="401" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL API</text>
    <rect x="596" y="392" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="630" y="401" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">INFERENCE</text>
    <rect x="80" y="156" width="200" height="88" rx="8" fill="#fbfaf6"/><rect x="80" y="156" width="200" height="88" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/>
    <rect x="92" y="168" width="48" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="116" y="177" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL</text>
    <text x="180" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Pi Agent</text><text x="180" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Runs on your computer or VPS</text>
    <rect x="380" y="156" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="392" y="168" width="64" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="424" y="177" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PROVIDER</text><text x="480" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Cloud service</text><text x="480" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Auth · routes · billing</text>
    <rect x="680" y="156" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="692" y="168" width="48" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="716" y="177" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">MODEL</text><text x="780" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Cloud model</text><text x="780" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Inference at the provider</text>
    <rect x="80" y="368" width="200" height="88" rx="8" fill="#fbfaf6"/><rect x="80" y="368" width="200" height="88" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="92" y="380" width="48" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="116" y="389" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL</text><text x="180" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Pi Agent</text><text x="180" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Still runs locally</text>
    <rect x="380" y="368" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="392" y="380" width="56" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="420" y="389" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">ROUTER</text><text x="480" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Local model interface</text><text x="480" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">for example llama.cpp</text>
    <rect x="680" y="368" width="200" height="88" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="692" y="380" width="48" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="716" y="389" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">MODEL</text><text x="780" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Local model</text><text x="780" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Inference on your own device</text>
    <line x1="40" y1="524" x2="920" y2="524" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="548" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">KEY</text><text x="112" y="548" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">Where the Agent runs and where the model performs inference are two different things.</text>
  </svg>
