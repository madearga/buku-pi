<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="portable-context-policy-title portable-context-policy-desc">
    <title id="portable-context-policy-title">One record, two model requests</title>
    <desc id="portable-context-policy-desc">A readable local session passes through an adjustable context policy, then each is turned into a model A and model B request; internal caches and vendor-hidden state do not migrate along with the session.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="portable-context-policy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker>
      <marker id="portable-context-policy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker>
      <marker id="portable-context-policy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker>
    </defs>
    <rect width="960" height="600" fill="#fbfaf6"/>
    <text x="40" y="72" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">When switching models, keep the readable work material, then make a new request</text>
    <line x1="40" y1="88" x2="920" y2="88" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>

    <rect x="40" y="144" width="552" height="312" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="52" y="152" width="100" height="12" rx="2" fill="#fbfaf6"/><text x="102" y="161" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL HARNESS</text>
    <rect x="640" y="144" width="280" height="312" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="652" y="152" width="96" height="12" rx="2" fill="#fbfaf6"/><text x="700" y="161" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PROVIDER API</text>

    <line x1="272" y1="308" x2="360" y2="308" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#portable-context-policy-arrow-accent)"/>
    <path d="M576 264 H608 Q616 264 616 256 V248 Q616 240 624 240 H680" fill="none" stroke="#276d89" stroke-width="1" marker-end="url(#portable-context-policy-arrow-link)"/>
    <path d="M576 352 H608 Q616 352 616 360 V376 Q616 384 624 384 H680" fill="none" stroke="#276d89" stroke-width="1" marker-end="url(#portable-context-policy-arrow-link)"/>

    <rect x="56" y="220" width="216" height="176" rx="6" fill="#fbfaf6"/><rect x="56" y="220" width="216" height="176" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/>
    <rect x="68" y="232" width="48" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="92" y="241" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">STATE</text>
    <text x="164" y="280" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Local Session</text>
    <text x="164" y="316" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Records, branches, and tool results</text>
    <text x="164" y="340" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Original entries can be traced</text>

    <rect x="360" y="220" width="216" height="176" rx="8" fill="#fbfaf6"/><rect x="360" y="220" width="216" height="176" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/>
    <rect x="372" y="232" width="64" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="404" y="241" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">CONTEXT</text>
    <text x="468" y="280" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Context policy</text>
    <text x="468" y="316" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Summarizing, retention, filtering</text>
    <text x="468" y="340" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Assembles this round's message</text>

    <rect x="680" y="188" width="216" height="104" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
    <rect x="692" y="200" width="80" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="732" y="209" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PROVIDER A</text>
    <text x="788" y="240" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Model A request</text><text x="788" y="264" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Converted to match API A</text>
    <rect x="680" y="332" width="216" height="104" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
    <rect x="692" y="344" width="80" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="732" y="353" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PROVIDER B</text>
    <text x="788" y="384" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Model B request</text><text x="788" y="408" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Converted to match API B</text>

    <line x1="40" y1="500" x2="920" y2="500" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <text x="40" y="528" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">PORTABLE</text><text x="160" y="528" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">Readable records and handoff rules that can still be inspected and adjusted.</text>
    <text x="40" y="560" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">NOT PORTABLE</text><text x="160" y="560" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">Internal KV caches and vendor-hidden state cannot be moved directly to another vendor.</text>
  </svg>
