<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sampul berbagi GitHub Buku Pi Pi Coding Agent</title>
  <desc id="desc">Judul edisi Bahasa Indonesia Buku Pi di atas kertas bergaris krem dan panel informasi edisi berwarna biru tua</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#26313a" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#f3f0e8"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="40" y="40" width="1200" height="560" fill="#fbfaf6" stroke="#c9c7c0" stroke-width="2"/>
  <rect x="835" y="40" width="405" height="560" fill="#26313a"/>

  <text x="96" y="106" fill="#276d89" font-family="SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">BUKU PI</text>
  <text x="752" y="106" fill="#276d89" font-family="SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">EDISI TERBUKA · 2026</text>
  <line x1="96" y1="135" x2="752" y2="135" stroke="#c9c7c0" stroke-width="2"/>

  <text x="94" y="235" fill="#26313a" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="66" font-style="italic" font-weight="600">Pi Coding Agent</text>
  <text x="96" y="310" fill="#26313a" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="56" font-weight="600">Buku Pi</text>
  <text x="96" y="370" fill="#26313a" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="27" font-weight="600">Dari tugas pertama yang bisa diverifikasi,</text>
  <text x="96" y="411" fill="#26313a" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="27" font-weight="600">menuju alur kerja Agent yang terkendali.</text>

  <rect x="96" y="456" width="140" height="38" fill="#276d89"/>
  <text x="166" y="481" fill="#fbfaf6" font-family="SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">SKENARIO</text>
  <text x="254" y="482" fill="#65727d" font-family="SFMono-Regular, Menlo, monospace" font-size="17">→ Konsep → Praktik → Verifikasi</text>
  <text x="96" y="552" fill="#65727d" font-family="SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">pi.argakuka.com</text>

  <text x="900" y="218" fill="#f8f5ed" font-family="Iowan Old Style, Baskerville, serif" font-size="146">P</text>
  <circle cx="1018" cy="226" r="16" fill="#4f90aa"/>
  <text x="900" y="292" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">JALUR BELAJAR</text>
  <line x1="900" y1="322" x2="1175" y2="322" stroke="#65727d" stroke-opacity=".6"/>
  <text x="900" y="370" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">Kursus utama</text>
  <text x="1175" y="370" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">14 pelajaran</text>
  <line x1="900" y1="392" x2="1175" y2="392" stroke="#65727d" stroke-opacity=".45"/>
  <text x="900" y="440" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">Studi kasus</text>
  <text x="1175" y="440" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">8 kasus</text>
  <line x1="900" y1="462" x2="1175" y2="462" stroke="#65727d" stroke-opacity=".45"/>
  <text x="900" y="510" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">Bahasa</text>
  <text x="1175" y="510" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">Indonesia</text>
</svg>
